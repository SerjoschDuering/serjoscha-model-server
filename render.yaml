# Render Blueprint: Render reads this file and creates the web service.
services:
  - type: web
    name: iaac-team0-model-server   # becomes https://iaac-team0-model-server.onrender.com (change per team)
    runtime: python
    plan: free
    region: frankfurt               # servers in Europe; cannot be changed later
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    healthCheckPath: /

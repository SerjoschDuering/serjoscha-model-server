# Render Blueprint: Render reads this file and creates the web service.
services:
  - type: web
    name: serjoscha-model-server   # becomes https://serjoscha-model-server.onrender.com (your own name)
    runtime: python
    plan: free
    region: frankfurt               # servers in Europe; cannot be changed later
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    healthCheckPath: /
